name: github pages

on:
  push:
    branches:
      - master  # Set a branch to deploy
  pull_request:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      # Hugo 0.170 removed the embedded LibSass transpiler, so the theme's SCSS
      # needs Dart Sass. Use the native binary: the npm `sass` wrapper does not
      # speak the embedded protocol Hugo drives it with.
      - name: Install Dart Sass
        run: |
          curl -sSL -o /tmp/dart-sass.tar.gz \
            https://github.com/sass/dart-sass/releases/download/1.108.2/dart-sass-1.108.2-linux-x64.tar.gz
          sudo tar -xzf /tmp/dart-sass.tar.gz -C /opt
          sudo ln -sf /opt/dart-sass/sass /usr/local/bin/sass
          sass --version

      - name: Build
        run: hugo --minify

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public